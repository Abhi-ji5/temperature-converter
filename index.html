<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter | OIBSIP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="converter-card">

            <div class="header">
                <p class="badge">OIBSIP • WEB DEVELOPMENT</p>

                <h1>Temperature Converter</h1>

                <p class="subtitle">
                    Convert temperatures quickly between Celsius,
                    Fahrenheit and Kelvin.
                </p>
            </div>

            <div class="converter-form">

                <div class="input-group">
                    <label for="temperature">Enter Temperature</label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="e.g. 25"
                        step="any"
                    >
                </div>

                <div class="input-group">
                    <label for="unit">Select Input Unit</label>

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button id="convertBtn">
                    Convert Temperature
                </button>

                <p id="errorMessage" class="error-message"></p>

            </div>

            <div class="results" id="results">

                <div class="result-box">
                    <span>Celsius</span>
                    <strong id="celsiusResult">--</strong>
                </div>

                <div class="result-box">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">--</strong>
                </div>

                <div class="result-box">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">--</strong>
                </div>

            </div>

            <footer>
                <p>Built with HTML, CSS & JavaScript</p>
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
